<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Простий Слот 3×3</title>
  <style>
    :root{
      --bg:#0f1115; --card:#161a22; --ink:#e8ecf3; --muted:#9aa4b2; --accent:#6ee7ff; --win:#35d07f; --lose:#ef4444;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; display:grid; place-items:center; background:radial-gradient(60% 80% at 50% 40%, #18202e, var(--bg));
      color:var(--ink); font:500 16px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
    }
    .app{ width:min(560px, 94vw); }
    .title{ text-align:center; font-weight:700; letter-spacing:.3px; margin:0 0 16px }

    .slot{
      background:linear-gradient(180deg, #1c2330, var(--card));
      border:1px solid #243044; border-radius:20px; padding:20px; box-shadow:0 10px 30px rgba(0,0,0,.35);
    }
    .window{ 
      display:grid; grid-template-columns:repeat(3, 1fr); grid-template-rows:repeat(3, 82px); 
      gap:10px; padding:14px; background:#0b0f16; border-radius:14px; border:1px solid #232c3f; position:relative;
    }
    .cell{ 
      display:grid; place-items:center; font-size:42px; background:#131a26; border-radius:12px; 
      border:1px solid #253149; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.02);
      transition:transform .15s ease;
    }
    .cell.win{ outline:2px solid var(--win); box-shadow:0 0 0 2px var(--win) inset, 0 0 20px rgba(53,208,127,.35) }

    .midline{ position:absolute; inset:auto 10px calc(50% - 1px) 10px; height:2px; background:linear-gradient(90deg, transparent, #3c4b66, transparent) }

    .panel{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:16px; justify-content:space-between }
    .left, .right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap }

    .badge{ background:#0b1018; border:1px solid #233149; padding:8px 10px; border-radius:10px; color:var(--muted) }
    .badge b{ color:var(--ink) }

    button{
      appearance:none; border:0; cursor:pointer; padding:12px 18px; border-radius:12px; font-weight:700; letter-spacing:.2px;
      background:linear-gradient(180deg, #28bbff, #0da2e7); color:#001420; box-shadow:0 6px 16px rgba(30,171,255,.35);
      transition:transform .06s ease, filter .2s ease; min-width:122px
    }
    button:hover{ filter:brightness(1.05) }
    button:active{ transform:translateY(1px) }
    button[disabled]{ filter:grayscale(1) brightness(.7); cursor:not-allowed }

    .msg{ text-align:center; margin:12px 0 0; color:var(--muted) }
    .msg.ok{ color:var(--win) } .msg.bad{ color:var(--lose) }
    .foot{ margin-top:10px; text-align:center; color:var(--muted); font-size:13px }
    .foot a{ color:var(--accent); text-decoration:none }
  </style>
</head>
<body>
  <main class="app">
    <h1 class="title">Слот 3×3 (натисни «Крутити»)</h1>

    <section class="slot" aria-live="polite">
      <div class="window" id="window">
        <div class="midline" aria-hidden="true"></div>
        <!-- 3x3 осередки -->
        <div class="cell" id="c0">🍒</div>
        <div class="cell" id="c1">🍋</div>
        <div class="cell" id="c2">🍇</div>
        <div class="cell" id="c3">🍋</div>
        <div class="cell" id="c4">💎</div>
        <div class="cell" id="c5">🍒</div>
        <div class="cell" id="c6">⭐</div>
        <div class="cell" id="c7">🍉</div>
        <div class="cell" id="c8">🔔</div>
      </div>

      <div class="panel">
        <div class="left">
          <div class="badge">Баланс: <b id="balance">100</b></div>
          <div class="badge">Ставка: <b id="bet">5</b></div>
        </div>
        <div class="right">
          <button id="spinBtn">Крутити</button>
        </div>
      </div>
      <p class="msg" id="msg">Виграш по середині 3 в ряд. 💎=x5, ⭐=x3, інші=x2</p>
    </section>
    <p class="foot">Made for you. Локальний, без бекенду. Можна змінити емодзі у коді.</p>
  </main>

  <script>
    // Символи та ваги (частота випадіння)
    const symbols = [
      { ch:'🍒', w:30, mul:2 },
      { ch:'🍋', w:25, mul:2 },
      { ch:'🍉', w:22, mul:2 },
      { ch:'🍇', w:18, mul:2 },
      { ch:'🔔', w:14, mul:2 },
      { ch:'⭐', w:8,  mul:3 },
      { ch:'💎', w:5,  mul:5 }
    ];

    const cells = Array.from({length:9}, (_,i)=>document.getElementById('c'+i));
    const spinBtn = document.getElementById('spinBtn');
    const balanceEl = document.getElementById('balance');
    const betEl = document.getElementById('bet');
    const msgEl = document.getElementById('msg');

    let balance = 100; // простий демо-баланс
    const bet = 5;

    function pickWeighted(){
      const total = symbols.reduce((s,x)=>s+x.w,0);
      let r = Math.random()*total;
      for(const s of symbols){ r -= s.w; if(r<=0) return s; }
      return symbols[symbols.length-1];
    }

    function setMiddleRow(a,b,c){
      cells[3].textContent = a.ch; // row 2 col 1
      cells[4].textContent = b.ch; // row 2 col 2
      cells[5].textContent = c.ch; // row 2 col 3
    }

    function randomizeAll(){
      for(const cell of cells){ cell.textContent = pickWeighted().ch; cell.classList.remove('win'); }
    }

    function evalWin(){
      const a = cells[3].textContent, b = cells[4].textContent, c = cells[5].textContent;
      if(a===b && b===c){
        const sym = symbols.find(s=>s.ch===a);
        const mult = sym?.mul || 2;
        const win = bet * mult;
        balance += win;
        [cells[3],cells[4],cells[5]].forEach(el=>el.classList.add('win'));
        msgEl.textContent = `Виграш! ${a.repeat(3)} ×${mult} (+${win})`;
        msgEl.className = 'msg ok';
      } else {
        msgEl.textContent = 'Нема виграшу. Спробуй ще!';
        msgEl.className = 'msg bad';
      }
      balanceEl.textContent = balance;
    }

    function animateSpin(){
      const start = performance.now();
      const durations = [800, 1000, 1200]; // кожен стовпець зупиняється по черзі
      const timers = [0,0,0];

      // Знімаємо підсвітку
      cells.forEach(c=>c.classList.remove('win'));

      return new Promise(resolve=>{
        function frame(t){
          const dt = t - start;
          for(let col=0; col<3; col++){
            if(dt < durations[col]){
              // оновлюємо відповідний стовпець (3 осередки)
              for(let row=0; row<3; row++){
                const idx = row*3 + col;
                // не частіше ніж раз на ~70мс
                if(t - timers[col] > 70){
                  cells[idx].textContent = pickWeighted().ch;
                }
              }
              timers[col] = t;
            }
          }
          if(dt < Math.max(...durations)) requestAnimationFrame(frame); else resolve();
        }
        requestAnimationFrame(frame);
      });
    }

    async function spin(){
      if(balance < bet){ msgEl.textContent = 'Недостатньо балансу'; msgEl.className='msg bad'; return; }
      spinBtn.disabled = true;
      msgEl.textContent = 'Крутиться…'; msgEl.className='msg';

      balance -= bet; balanceEl.textContent = balance;
      await animateSpin();

      // фінальні символи для середнього ряду
      const a = pickWeighted(), b = pickWeighted(), c = pickWeighted();
      setMiddleRow(a,b,c);
      // доб’ємо інші клітинки випадково, щоб виглядало живо
      for(const i of [0,1,2,6,7,8]) cells[i].textContent = pickWeighted().ch;

      evalWin();
      spinBtn.disabled = false;
    }

    spinBtn.addEventListener('click', spin);

    // Ініціалізація
    randomizeAll();
  </script>
</body>
</html>
