<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Slot Machine 3x3</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at center, #1a1d25 0%, #0b0c10 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
      color: #fff;
    }
    .machine {
      position: relative;
      background: linear-gradient(180deg, #f5d77b 0%, #b8860b 100%);
      border-radius: 20px;
      padding: 30px 40px 80px 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.4);
      text-align: center;
    }
    .title {
      font-weight: 900;
      font-size: 22px;
      margin-bottom: 16px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .reels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: #111522;
      border-radius: 12px;
      padding: 10px;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
    }
    .cell {
      width: 110px;
      height: 110px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 64px;
      background: #1b1f2e;
      border-radius: 10px;
      border: 1px solid #2d3348;
      transition: transform 0.15s;
    }
    .lever {
      position: absolute;
      right: -60px;
      top: 40px;
      width: 40px;
      height: 260px;
      background: linear-gradient(180deg, #b0b9c8, #4a5568);
      border-radius: 20px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.4);
    }
    .knob {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translate(-50%, 0);
      width: 60px;
      height: 60px;
      background: radial-gradient(circle at 30% 30%, #ffb8b8, #b90000);
      border-radius: 50%;
      border: 2px solid #660000;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .pulling .knob {
      transform: translate(-50%, 160px);
    }
    .msg {
      margin-top: 16px;
      color: #eee;
    }
    .highlight {
      outline: 3px solid #2ad07a;
      box-shadow: 0 0 20px #2ad07a;
    }
  </style>
</head>
<body>
  <div class="machine">
    <div class="title">🎰 Golden Slot Machine</div>
    <div class="reels" id="reels"></div>
    <div class="lever" id="lever">
      <div class="knob"></div>
    </div>
    <div class="msg" id="msg">Pull the lever to spin!</div>
  </div>

  <script>
    const reels = document.getElementById('reels');
    const lever = document.getElementById('lever');
    const msg = document.getElementById('msg');

    const symbols = ['🍒','🍋','🍇','🍉','⭐','💎','🔔','7️⃣'];

    // Create 3x3 grid
    const grid = [];
    for (let i = 0; i < 9; i++) {
      const div = document.createElement('div');
      div.className = 'cell';
      div.textContent = symbols[Math.floor(Math.random()*symbols.length)];
      reels.appendChild(div);
      grid.push(div);
    }

    function spinAnimation() {
      return new Promise(resolve => {
        const spins = 15;
        let count = 0;
        const interval = setInterval(() => {
          for (let i = 0; i < 9; i++) {
            grid[i].textContent = symbols[Math.floor(Math.random()*symbols.length)];
          }
          count++;
          if (count >= spins) {
            clearInterval(interval);
            resolve();
          }
        }, 80);
      });
    }

    async function spin() {
      lever.classList.add('pulling');
      msg.textContent = 'Spinning...';
      await spinAnimation();

      // Final combination
      const final = [symbols[Math.floor(Math.random()*symbols.length)], symbols[Math.floor(Math.random()*symbols.length)], symbols[Math.floor(Math.random()*symbols.length)]];
      grid[3].textContent = final[0];
      grid[4].textContent = final[1];
      grid[5].textContent = final[2];

      // Check win
      if (final[0] === final[1] && final[1] === final[2]) {
        msg.textContent = `You won! ${final[0]} ${final[1]} ${final[2]}`;
        grid[3].classList.add('highlight');
        grid[4].classList.add('highlight');
        grid[5].classList.add('highlight');
      } else {
        msg.textContent = 'No win, try again!';
        grid[3].classList.remove('highlight');
        grid[4].classList.remove('highlight');
        grid[5].classList.remove('highlight');
      }
      setTimeout(()=>lever.classList.remove('pulling'),300);
    }

    lever.addEventListener('click', spin);
  </script>
</body>
</html>
