<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Golden Slot 3×3</title>
  <style>
    :root{
      --bg:#0a0c10; 
      --gold1:#f9f2a8; --gold2:#ffd96a; --gold3:#f2ac2e; --gold4:#b8790b; --gold5:#fff2c4;
      --ink:#101215; --inkInv:#f7fbff; --muted:#b7c2d3; --win:#2ad07a; --lose:#ff4d4d; --accent:#7ae6ff;
      --cell:#f5efe2; --edge:#2a3346; --glass:#0b0f16;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; display:grid; place-items:center; background:radial-gradient(70% 90% at 50% 40%, #182135, var(--bg));
      color:var(--inkInv); font:600 16px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial;
    }
    .wrap{ width:min(820px,96vw); }
    .title{ text-align:center; margin:0 0 18px; font-weight:900; letter-spacing:.4px }

    /* === CABINET (gold) === */
    .cabinet{ position:relative; border-radius:26px; padding:26px 26px 44px; 
      background:
        radial-gradient(120% 140% at 0% 0%, #ffffff55, #0000 34%),
        linear-gradient(180deg, var(--gold5), var(--gold2) 22%, var(--gold3) 45%, var(--gold4) 70%, #8a5d09 92%);
      border:1px solid rgba(255,255,255,.35);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.25),
        inset 0 12px 24px rgba(255,255,255,.22),
        inset 0 -12px 30px rgba(0,0,0,.25),
        0 16px 50px rgba(0,0,0,.55);
      color:#201b10;
    }
    .bezel{ position:relative; border-radius:18px; padding:16px; background:linear-gradient(180deg,#c69c36,#8a640e); box-shadow:inset 0 2px 1px rgba(255,255,255,.4), inset 0 -2px 6px rgba(0,0,0,.5); }

    /* LIGHT BULBS AROUND */
    .bezel:before{ content:""; position:absolute; inset:-10px; border-radius:24px; pointer-events:none; background:
      radial-gradient(circle at 18px 18px,#ffd84a 0 4px,#0000 5px),
      radial-gradient(circle at calc(100% - 18px) 18px,#ffd84a 0 4px,#0000 5px),
      radial-gradient(circle at 18px calc(100% - 18px),#ffd84a 0 4px,#0000 5px),
      radial-gradient(circle at calc(100% - 18px) calc(100% - 18px),#ffd84a 0 4px,#0000 5px);
      filter:drop-shadow(0 0 6px #ffd84a);
    }

    /* VIEWPORT (glass) */
    .viewport{ position:relative; border-radius:14px; padding:14px; background:linear-gradient(180deg,#141921,#0d121b); border:1px solid #2e3a52; box-shadow:inset 0 0 30px rgba(0,0,0,.65); }
    .glass{ position:absolute; inset:0; border-radius:14px; pointer-events:none; background:
      linear-gradient(12deg, #ffffff10 0%, #ffffff05 30%, #00000000 40%),
      linear-gradient(180deg, #0000 60%, #00000055 100%);
      mix-blend-overlay;
    }

    /* REELS (3 columns with strips) */
    .reels{ position:relative; display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }
    .reel{ position:relative; height:270px; overflow:hidden; border-radius:10px; background:var(--cell); border:1px solid #e0d6c4; box-shadow:inset 0 0 0 2px #fff8, inset 0 30px 30px #0002, inset 0 -30px 30px #0002; }
    .strip{ position:absolute; left:0; right:0; top:0; will-change:transform; }
    .symbol{ display:flex; align-items:center; justify-content:center; height:90px; font-size:44px; color:#d01616; }
    .symbol.bar{ background:#111; color:#fff; font-weight:900; letter-spacing:.5px; font-size:24px; }
    .symbol.seven{ color:#d01515; text-shadow:0 2px 0 #0003; font-weight:900; font-size:46px }

    /* Middle win line */
    .midline{ position:absolute; left:14px; right:14px; top:calc(50% - 1px); height:2px; background:linear-gradient(90deg, transparent,#6e86b8, transparent) }
    .winhighlight .midline{ background:linear-gradient(90deg, transparent,#2ad07a, transparent) }

    /* LEVER */
    .lever{ position:absolute; right:-86px; top:46px; width:86px; height:220px; display:grid; place-items:center; cursor:pointer; user-select:none }
    .rod{ width:12px; height:170px; border-radius:8px; background:linear-gradient(180deg,#b9c7da,#6e7d98,#2e3a52); box-shadow:inset 0 0 6px #0006; transform-origin:top center; transition:transform .22s ease }
    .knob{ position:absolute; bottom:0; width:44px; height:44px; border-radius:50%; background:radial-gradient(circle at 30% 30%, #ffe0e0, #ff3b3b); border:1px solid #8e1515; box-shadow:0 10px 22px rgba(0,0,0,.45), inset 0 2px 6px rgba(255,255,255,.35); transform:translateY(12px); transition:transform .22s ease }
    .pull .rod{ transform:rotate(20deg) }
    .pull .knob{ transform:translateY(26px) }
    .lever.disabled{ pointer-events:none; filter:grayscale(.5) brightness(.9) }

    /* PAYOUT TRAY / BASE / SIDE DETAILS */
    .coin-slot{ position:absolute; left:18px; top:80px; width:38px; height:6px; border-radius:4px; background:#0b0f16; border:1px solid #2b3548; box-shadow:inset 0 1px 0 rgba(255,255,255,.12) }
    .payout-tray{ position:absolute; left:18px; bottom:22px; width:140px; height:26px; border-radius:12px; background:#0b0f16; border:1px solid #2b3548; box-shadow:inset 0 1px 0 rgba(255,255,255,.12) }
    .base{ position:absolute; left:24px; right:24px; bottom:-10px; height:14px; border-radius:0 0 18px 18px; background:linear-gradient(180deg,#7a560e,#3a2704); box-shadow:0 12px 30px rgba(0,0,0,.6) }

    /* TEXT / BADGES */
    .panel{ display:flex; gap:12px; align-items:center; justify-content:space-between; margin-top:14px }
    .badges{ display:flex; gap:10px; flex-wrap:wrap }
    .badge{ background:linear-gradient(180deg,#182030,#121824); border:1px solid #2f3b54; padding:8px 12px; border-radius:10px; color:#cbd5e1; }
    .badge b{ color:#fff }

    /* FX */
    canvas#fx{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; border-radius:14px }
    @keyframes popGlow{ 0%{box-shadow:0 0 0 2px #2ad07a inset, 0 0 0 rgba(42,208,122,0)} 50%{box-shadow:0 0 0 2px #2ad07a inset, 0 0 26px rgba(42,208,122,.6)} 100%{box-shadow:0 0 0 2px #2ad07a inset, 0 0 0 rgba(42,208,122,0)} }
    .pop{ animation:popGlow .7s ease }

  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="title">Golden Slot 3×3 — pull the lever</h1>

    <section class="cabinet" aria-live="polite">
      <div class="bezel">
        <div class="viewport" id="viewport">
          <div class="midline" aria-hidden="true"></div>
          <div class="reels" id="reels">
            <div class="reel" id="reel0"><div class="strip"></div></div>
            <div class="reel" id="reel1"><div class="strip"></div></div>
            <div class="reel" id="reel2"><div class="strip"></div></div>
          </div>
          <div class="glass" aria-hidden="true"></div>
          <canvas id="fx"></canvas>
        </div>
      </div>

      <div class="lever" id="lever" role="button" aria-label="Pull to spin" tabindex="0">
        <div class="rod"></div>
        <div class="knob"></div>
      </div>

      <div class="coin-slot" aria-hidden="true"></div>
      <div class="payout-tray" aria-hidden="true"></div>
      <div class="base" aria-hidden="true"></div>

      <div class="panel">
        <div class="badges">
          <div class="badge">Balance: <b id="balance">100</b></div>
          <div class="badge">Bet: <b id="bet">5</b></div>
        </div>
        <div class="badge" id="msg">Win = middle line match. 💎×5, ⭐×3, others ×2</div>
      </div>
    </section>
  </main>

  <script>
    // === Symbols ===
    const SYMBOLS = [
      { type:'seven', html:'7', mul:7, w:5 },
      { type:'cherry', html:'🍒', mul:2, w:18 },
      { type:'lemon',  html:'🍋', mul:2, w:20 },
      { type:'orange', html:'🍊', mul:2, w:18 },
      { type:'grape',  html:'🍇', mul:2, w:16 },
      { type:'bell',   html:'🔔', mul:2, w:12 },
      { type:'star',   html:'⭐', mul:3, w:8  },
      { type:'bar',    html:'BAR', mul:3, w:6  },
      { type:'water',  html:'🍉', mul:2, w:14 },
    ];

    function weightedPick(){
      const total = SYMBOLS.reduce((s,x)=>s+x.w,0);
      let r = Math.random()*total;
      for(const s of SYMBOLS){ r -= s.w; if(r<=0) return s; }
      return SYMBOLS[0];
    }

    function symbolNode(sym){
      const div = document.createElement('div');
      div.className = 'symbol ' + (sym.type==='bar'?'bar': sym.type==='seven'?'seven':'' );
      div.innerHTML = sym.type==='bar' ? 'BAR' : (sym.type==='seven' ? '7' : sym.html);
      return div;
    }

    // Build strips (looped)
    const reels = [...document.querySelectorAll('.reel')];
    const strips = reels.map(r=>r.querySelector('.strip'));

    const VISIBLE = 3;           // 3 rows visible
    const CELL_H = 90;           // must match CSS
    const STRIP_LEN = 24;        // lots for smooth spin

    function fillStrips(){
      strips.forEach(strip=>{ strip.innerHTML=''; for(let i=0;i<STRIP_LEN;i++){ strip.appendChild(symbolNode(weightedPick())); } });
    }

    // State
    let balance = 100; const bet = 5;
    const balanceEl = document.getElementById('balance');
    const betEl = document.getElementById('bet');
    const msgEl = document.getElementById('msg');
    const viewport = document.getElementById('viewport');
    const lever = document.getElementById('lever');
    const fx = document.getElementById('fx'); const fxc = fx.getContext('2d');

    function resizeFx(){ const r = viewport.getBoundingClientRect(); fx.width = r.width|0; fx.height = r.height|0; }
    new ResizeObserver(resizeFx).observe(viewport);

    function setMessage(t, ok=false){ msgEl.textContent=t; msgEl.style.color = ok? '#2ad07a' : '#cbd5e1'; }

    // Spin animation per reel
    function animateReel(i, duration){
      const strip = strips[i];
      let start=null; let last=0; let offset=0; // px
      return new Promise(res=>{
        function step(t){
          if(!start) start=t; const dt=t-start; const elapsed=t-last; last=t;
          // ease-out speed
          const p = Math.min(dt/duration,1);
          const speed = 12*(1-p)+2; // px per frame approx
          offset += speed; if(offset> CELL_H){
            // move first to end to loop seamlessly
            strip.appendChild(strip.firstElementChild); offset -= CELL_H;
          }
          strip.style.transform = `translateY(${-offset}px)`;
          if(dt<duration) requestAnimationFrame(step); else res();
        }
        requestAnimationFrame(step);
      });
    }

    function pickFinalTriple(){ return [weightedPick(), weightedPick(), weightedPick()]; }

    function setMiddleRowSymbols(finalSyms){
      // After spin stop, overwrite the middle row with chosen symbols for win/eval
      // Middle row is index 1 of visible (0,1,2)
      reels.forEach((reel, idx)=>{
        const strip = strips[idx];
        const mid = strip.children[1];
        mid.replaceWith(symbolNode(finalSyms[idx]));
      });
    }

    function evaluate(finalSyms){
      const [a,b,c] = finalSyms; 
      if(a.type===b.type && b.type===c.type){
        const mult = a.mul || 2; const win = bet*mult; balance += win; balanceEl.textContent=balance;
        // pop highlight
        viewport.classList.add('winhighlight');
        setMessage(`Win! ${a.type.toUpperCase()} ×${mult} ( +${win} )`, true);
        playWinSound(); confetti();
        setTimeout(()=>viewport.classList.remove('winhighlight'), 1200);
      } else {
        setMessage('No win. Try again!');
      }
    }

    // Audio win
    let audioCtx; function playWinSound(){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const now=audioCtx.currentTime; const g=audioCtx.createGain(); g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime(0.6,now+0.02); g.gain.exponentialRampToValueAtTime(0.0001,now+0.62); g.connect(audioCtx.destination); [880,1175,1568].forEach((f,i)=>{ const o=audioCtx.createOscillator(); o.type=i? 'sine':'triangle'; o.frequency.setValueAtTime(f,now); o.connect(g); o.start(now+i*0.02); o.stop(now+0.64+i*0.02); }); }catch(e){} }

    // Confetti
    function confetti(){ const W=fx.width,H=fx.height; if(!W||!H) return; const N=90; const P=Array.from({length:N},()=>({x:Math.random()*W,y:-10-Math.random()*40,vx:(Math.random()-.5)*1.6,vy:2+Math.random()*3.5,r:2+Math.random()*3,a:1})); const S=performance.now(); (function tick(t){ fxc.clearRect(0,0,W,H); P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.02; p.a-=0.005; fxc.globalAlpha=Math.max(0,p.a); fxc.beginPath(); fxc.arc(p.x,p.y,p.r,0,Math.PI*2); fxc.fillStyle=['#2ad07a','#7ae6ff','#fff','#facc15','#ff4d4d'][p.r|0 % 5]; fxc.fill(); }); fxc.globalAlpha=1; if(t-S<1400) requestAnimationFrame(tick); else fxc.clearRect(0,0,W,H); })(S); }

    // Main spin sequence
    let spinning=false;
    async function spin(){
      if(spinning) return; if(balance < bet){ setMessage('Not enough balance'); return; }
      spinning=true; setMessage('Spinning…'); balance -= bet; balanceEl.textContent=balance;
      lever.classList.add('pull'); lever.classList.add('disabled');
      // animate reels with stagger
      await Promise.all([
        animateReel(0, 1100),
        (async()=>{ await new Promise(r=>setTimeout(r,120)); await animateReel(1, 1300); })(),
        (async()=>{ await new Promise(r=>setTimeout(r,240)); await animateReel(2, 1500); })(),
      ]);
      // pick final middle symbols and evaluate
      const finals = pickFinalTriple();
      setMiddleRowSymbols(finals);
      evaluate(finals);
      lever.classList.remove('pull'); lever.classList.remove('disabled');
      spinning=false;
    }

    // Init build
    fillStrips(); resizeFx();

    // Interactions
    function trySpin(){ if(!lever.classList.contains('disabled')) spin(); }
    lever.addEventListener('click', trySpin);
    lever.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); trySpin(); } });
  </script>
</body>
</html>
